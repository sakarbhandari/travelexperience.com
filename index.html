<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Experience Share</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🌍 Travel Experience Share</h1>
  </header>

  <main class="container">
    <section class="form-section">
      <h2>Share Your Experience</h2>
      <form>
        <input type="text" placeholder="Location" required />
        <textarea placeholder="Describe your experience..." required></textarea>
        <input type="url" placeholder="Image URL (optional)" />
        <button type="submit">Submit</button>
      </form>
    </section>

    <section class="experiences">
      <h2>Recent Experiences</h2>
      <div class="card-grid">
        <div class="card">
          <img src="https://source.unsplash.com/400x200/?paris" alt="Paris" />
          <div class="card-content">
            <h3>Paris, France</h3>
            <p>A beautiful experience exploring the Eiffel Tower and French cafes!</p>
          </div>
        </div>

        <div class="card">
          <img src="https://source.unsplash.com/400x200/?bali" alt="Bali" />
          <div class="card-content">
            <h3>Bali, Indonesia</h3>
            <p>Relaxed on the beaches and soaked in the tropical beauty of Bali.</p>
          </div>
        </div>
        <!-- Add more cards as needed -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Travel Experience Share</p>
  </footer>
</body>
</html>
